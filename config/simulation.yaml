
world:
  name: "Project Elysium"
  version: "0.2.0"
  mode: "persistent"

simulation:
  enabled: true
  start_datetime: "0001-01-01T08:00:00"
  time_scale: 60
  allow_offline_progress: true
  autosave_interval_seconds: 10

calendar:
  days_per_month: 30
  months_per_year: 12

population:
  initial_population: 10
  maximum_population: 10

citizens:
  autonomous: true
  memory_enabled: true
  social_interaction: true
  goal_system: true

system:
  log_level: "INFO"
  autosave_enabled: true
